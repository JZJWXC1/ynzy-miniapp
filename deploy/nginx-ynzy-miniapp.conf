    client_max_body_size 320m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location ^~ /api/mobile/ {
        proxy_pass http://127.0.0.1:5202;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
